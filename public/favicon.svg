<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft ground contact shadow -->
  <ellipse cx="32" cy="59" rx="26" ry="3.5" fill="#000000" fill-opacity="0.18"/>
  
  <!-- Aluminum Frame Legs -->
  <!-- Back legs -->
  <line x1="15" y1="36" x2="15" y2="56" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="36" x2="49" y2="56" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Front legs -->
  <line x1="8" y1="39" x2="8" y2="58" stroke="#94a3b8" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="56" y1="39" x2="56" y2="58" stroke="#94a3b8" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Foot pads -->
  <rect x="5.5" y="57" width="5" height="2" rx="1" fill="#475569"/>
  <rect x="53.5" y="57" width="5" height="2" rx="1" fill="#475569"/>
  
  <!-- Canopy Roof Geometry -->
  <!-- Left roof facet (shadowed) -->
  <polygon points="32,7 8,30 20,32 32,18" fill="#991b1b"/>
  <!-- Right roof facet (subtle shadow) -->
  <polygon points="32,7 56,30 44,32 32,18" fill="#b91c1c"/>
  <!-- Front main roof slope (primary illuminated face) -->
  <polygon points="32,7 8,30 56,30" fill="#ef4444"/>
  
  <!-- Front Valance Ribbon / Hanging flap -->
  <polygon points="8,30 56,30 56,39 8,39" fill="#dc2626"/>
  <line x1="8" y1="39" x2="56" y2="39" stroke="#991b1b" stroke-width="1.2"/>
  
  <!-- Valance White Print Banner Brand Strip -->
  <rect x="18" y="32.5" width="28" height="4" rx="1" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Peak Hardware Cap -->
  <circle cx="32" cy="7" r="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.75"/>
</svg>
